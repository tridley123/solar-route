<html lang="en">
<head>
<meta charset="utf-8">

<title>Parkes &amp; Forbes &ndash; Field Ops Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg:#0f1720;--panel:#16212e;--line:#243244;--txt:#e7eef5;--muted:#8ea3b8;--accent:#3aa0ff;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);}
#app{display:flex;height:100vh;overflow:hidden;}
#map{flex:1;height:100%;}
#sidebar{width:344px;max-width:82%;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;transition:transform .25s ease;}
#sidebar.hidden{transform:translateX(100%);position:absolute;right:0;top:0;bottom:0;z-index:1200;}
header{padding:12px 14px;border-bottom:1px solid var(--line);}
header h1{font-size:15px;margin:0 0 8px;font-weight:650;}
.stats{font-size:11.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;}
.stats b{color:var(--txt);}
.controls{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;}
input[type=search]{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:#0d1620;color:var(--txt);font-size:14px;}
.filters{display:flex;flex-wrap:wrap;gap:6px;}
.chip{font-size:11px;padding:5px 9px;border-radius:20px;border:1px solid var(--line);background:#0d1620;color:var(--muted);cursor:pointer;user-select:none;}
.chip.active{color:#fff;border-color:transparent;}
.list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.zone{padding:8px 12px 2px;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);}
.item{padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:9px;align-items:flex-start;}
.item:active{background:#1d2b3a;}
.item.done{opacity:.45;}
.item.done .nm{text-decoration:line-through;}
.dot{width:11px;height:11px;border-radius:50%;margin-top:3px;flex:none;}
.dot.multi{background:conic-gradient(#f4c430,#3aa0ff,#37d67a,#f4c430);}
.meta{flex:1;min-width:0;}
.nm{font-size:13.5px;font-weight:600;}
.ad{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tg{font-size:10.5px;color:var(--muted);margin-top:2px;}
.badge{display:inline-block;background:#243244;border-radius:8px;padding:0 5px;margin-left:4px;font-size:10px;color:#cfe;}
.chk{font-size:16px;color:var(--muted);flex:none;}
.item.done .chk{color:#37d67a;}
#togglebtn{position:absolute;top:10px;right:10px;z-index:1300;background:var(--panel);border:1px solid var(--line);color:var(--txt);width:42px;height:42px;border-radius:10px;font-size:18px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4);}
.sync{padding:8px 12px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;}
.sync button{background:none;border:1px solid var(--line);color:var(--accent);border-radius:6px;padding:4px 8px;font-size:11px;cursor:pointer;}
.leaflet-popup-content{font-size:13px;line-height:1.45;}
.leaflet-popup-content b{font-size:14px;}
.joblist{margin:5px 0 0;padding:0;list-style:none;}
.joblist li{font-size:12px;color:#333;display:flex;align-items:center;gap:6px;}
.jdot{width:8px;height:8px;border-radius:50%;flex:none;}
.pop-btns{margin-top:7px;display:flex;gap:6px;}
.pop-btns a,.pop-btns button{font-size:12px;text-decoration:none;padding:5px 9px;border-radius:6px;border:1px solid #ccc;color:#0d1620;background:#eef3f8;cursor:pointer;}
.approx{color:#e0a030;font-size:10.5px;}
@media(max-width:760px){#sidebar{position:absolute;right:0;top:0;bottom:0;z-index:1200;box-shadow:-4px 0 18px rgba(0,0,0,.5);}}
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <button id="togglebtn">&#9776;</button>
  <div id="sidebar">
    <header>
      <h1>Parkes &amp; Forbes &ndash; Field Ops</h1>

    </header>

      <div class="filters" id="townf"></div>

    </div>
    <div class="list" id="list"></div>
    <div class="sync">
      <span id="syncmsg">Local only &ndash; add JSONBin keys to sync</span>
      <button id="resetbtn">Reset</button>
    </div>
  </div>
</div>

// ---- JSONBin sync (fill these to enable team sync; leave blank for local-only) ----
const JSONBIN_ID  = "";
const JSONBIN_KEY = "";
const JSONBIN_URL = JSONBIN_ID ? "https://api.jsonbin.io/v3/b/"+JSONBIN_ID : null;

const TYPE_COLORS = {
 "Solar":"#f4c430","Battery":"#3aa0ff","Solar & Battery":"#37d67a",
 "HWHP":"#c86bff","Top-up & Battery":"#ff8c42","Battery & HWHP":"#ff5c7a"};
const typeColor = t => TYPE_COLORS[t] || "#9aa";
const pinColor  = d => d.types.length>1 ? "#00d0c0" : typeColor(d.types[0]);

const LS="pf_fieldops_done";
let done=JSON.parse(localStorage.getItem(LS)||"{}");
let activeTown="All",activeType="All",query="";

const map=L.map("map",{zoomControl:true}).setView([-33.26,148.09],10);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {maxZoom:19,attribution:"&copy; OpenStreetMap"}).addTo(map);

const markers={};
DATA.forEach(d=>{
  const m=L.circleMarker([d.lat,d.lng],{radius:7,color:"#0d1620",weight:1.5,
    fillColor:pinColor(d),fillOpacity:.95});
  const q=encodeURIComponent(d.address+" NSW "+d.postcode);
  const jobs=d.jobs.map(j=>"<li><span class='jdot' style='background:"+typeColor(j.type)+"'></span>"+j.type+" &bull; "+j.quarter+"</li>").join("");
  m.bindPopup("<b>"+d.name+"</b><br>"+d.address+" "+d.postcode+
    (d.approx?"<br><span class='approx'>&#9888; approx location</span>":"")+
    "<ul class='joblist'>"+jobs+"</ul>"+
    "<div class='pop-btns'>"+
    "<a href='https://www.google.com/maps/dir/?api=1&destination="+q+"' target='_blank'>Directions</a>"+
    "<button onclick=\"toggleDone("+d.id+")\">Toggle done</button></div>");
  m.on("click",()=>highlight(d.id));
  m._d=d; markers[d.id]=m; m.addTo(map);
});

function refreshMarker(id){
  const m=markers[id],d=m._d,isDone=!!done[id];
  m.setStyle({fillOpacity:isDone?.25:.95,fillColor:isDone?"#5a6b7c":pinColor(d),radius:isDone?5:7});
}
window.toggleDone=function(id){done[id]=!done[id];if(!done[id])delete done[id];persist();refreshMarker(id);render();pushSync();};
function highlight(id){const m=markers[id];map.setView(m.getLatLng(),16,{animate:true});m.openPopup();}
function persist(){localStorage.setItem(LS,JSON.stringify(done));}

function matches(d){
  if(activeTown!=="All"&&d.town!==activeTown)return false;
  if(activeType!=="All"&&!d.types.includes(activeType))return false;
  if(query){const s=(d.name+" "+d.address+" "+d.jobs.map(j=>j.type+" "+j.quarter).join(" ")).toLowerCase();
    if(!s.includes(query))return false;}
  return true;
}
function render(){
  const list=document.getElementById("list");list.innerHTML="";
  const shown=DATA.filter(matches);
  const byZone={};shown.forEach(d=>{(byZone[d.town]=byZone[d.town]||[]).push(d);});
  Object.keys(byZone).sort().forEach(zone=>{
    const h=document.createElement("div");h.className="zone";
    h.textContent=zone+" ("+byZone[zone].length+")";list.appendChild(h);
    byZone[zone].sort((a,b)=>a.address.localeCompare(b.address)).forEach(d=>{
      const el=document.createElement("div");el.className="item"+(done[d.id]?" done":"");
      const dotcls=d.types.length>1?"dot multi":"dot";
      const dotstyle=d.types.length>1?"":"background:"+typeColor(d.types[0]);
      const badge=d.jobs.length>1?"<span class='badge'>"+d.jobs.length+" jobs</span>":"";
      el.innerHTML="<span class='"+dotcls+"' style='"+dotstyle+"'></span>"+
        "<div class='meta'><div class='nm'>"+d.name+badge+"</div>"+
        "<div class='ad'>"+d.address+"</div>"+
        "<div class='tg'>"+d.types.join(", ")+(d.approx?" &bull; &#9888;":"")+"</div></div>"+
        "<div class='chk'>"+(done[d.id]?"&#10004;":"&#9675;")+"</div>";
      el.querySelector(".meta").onclick=()=>highlight(d.id);
      el.querySelector(".chk").onclick=e=>{e.stopPropagation();toggleDone(d.id);};
      list.appendChild(el);
    });
  });
  const totalJobs=DATA.reduce((n,d)=>n+d.jobs.length,0);
  document.getElementById("s-total").textContent=DATA.length;
  document.getElementById("s-jobs").textContent=totalJobs;
  document.getElementById("s-done").textContent=Object.keys(done).length;
  document.getElementById("s-shown").textContent=shown.length;
}
function buildFilters(){
  const towns=["All",...new Set(DATA.map(d=>d.town))];
  const types=["All",...new Set(DATA.flatMap(d=>d.types))];
  const tf=document.getElementById("townf");
  towns.forEach(t=>{const c=document.createElement("span");c.className="chip"+(t==="All"?" active":"");
    c.textContent=t;if(t==="All")c.style.background="#3aa0ff";
    c.onclick=()=>{activeTown=t;[...tf.children].forEach(x=>{x.classList.remove("active");x.style.background="#0d1620";});c.classList.add("active");c.style.background="#3aa0ff";render();};
    tf.appendChild(c);});
  const yf=document.getElementById("typef");
  types.forEach(t=>{const c=document.createElement("span");c.className="chip"+(t==="All"?" active":"");
    const col=t==="All"?"#3aa0ff":typeColor(t);if(t==="All")c.style.background=col;else c.style.borderColor=col;
    c.textContent=t;
    c.onclick=()=>{activeType=t;[...yf.children].forEach(x=>{x.classList.remove("active");x.style.background="#0d1620";});c.classList.add("active");c.style.background=col;render();};
    yf.appendChild(c);});
}
document.getElementById("search").addEventListener("input",e=>{query=e.target.value.toLowerCase().trim();render();});
document.getElementById("togglebtn").onclick=()=>document.getElementById("sidebar").classList.toggle("hidden");
document.getElementById("resetbtn").onclick=()=>{if(confirm("Clear all check-offs?")){done={};persist();DATA.forEach(d=>refreshMarker(d.id));render();pushSync();}};

async function pullSync(){if(!JSONBIN_URL)return;
  try{const r=await fetch(JSONBIN_URL+"/latest",{headers:{"X-Master-Key":JSONBIN_KEY}});
    const j=await r.json();if(j&&j.record&&j.record.done){done=j.record.done;persist();DATA.forEach(d=>refreshMarker(d.id));render();
      document.getElementById("syncmsg").textContent="Synced \u2713";}}
  catch(e){document.getElementById("syncmsg").textContent="Sync error";}}
let pushT;function pushSync(){if(!JSONBIN_URL)return;clearTimeout(pushT);
  pushT=setTimeout(async()=>{try{await fetch(JSONBIN_URL,{method:"PUT",
    headers:{"Content-Type":"application/json","X-Master-Key":JSONBIN_KEY},body:JSON.stringify({done})});
    document.getElementById("syncmsg").textContent="Synced \u2713 "+new Date().toLocaleTimeString();}
    catch(e){document.getElementById("syncmsg").textContent="Sync error";}},800);}

buildFilters();DATA.forEach(d=>refreshMarker(d.id));render();
if(JSONBIN_URL){document.getElementById("syncmsg").textContent="Syncing\u2026";pullSync();}
</script>
