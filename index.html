<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar Customer Route Map</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg: #f5f2ec;
  --panel: #fff;
  --border: #e0dbd0;
  --text: #1a1a18;
  --muted: #888880;
  --accent: #d4500a;
  --solar: #e8940a;
  --battery: #2a9e6e;
  --solbat: #1a6db5;
  --hwhp: #8b44b8;
  --other: #888;
}
body {
  font-family: 'Syne', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── HEADER ── */
header {
  background: var(--text);
  color: var(--bg);
  padding: 10px 20px;
  display: flex;
  align-items: center;
  gap: 20px;
  flex-shrink: 0;
  border-bottom: 3px solid var(--accent);
}
.logo { font-size: 15px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; }
.logo span { color: var(--accent); }
.legend { display: flex; gap: 14px; align-items: center; margin-left: 10px; }
.leg { display:flex; align-items:center; gap:5px; font-family:'JetBrains Mono',monospace; font-size:10px; color:#aaa; }
.leg-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
.header-right { margin-left:auto; display:flex; align-items:center; gap:10px; }
.total-badge {
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  background: rgba(255,255,255,0.1);
  padding: 4px 10px;
  border-radius: 20px;
  color: #ccc;
}
.open-gmaps-btn {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 6px 14px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 700;
  font-family: 'Syne', sans-serif;
  letter-spacing: 1px;
  cursor: pointer;
  text-transform: uppercase;
  transition: opacity 0.2s;
}
.open-gmaps-btn:hover { opacity: 0.85; }

/* ── CONTROLS ── */
.controls {
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  padding: 8px 20px;
  display: flex;
  gap: 10px;
  align-items: center;
  flex-shrink: 0;
}
input[type=text], select {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 12px;
  border-radius: 4px;
  font-size: 12px;
  font-family: 'Syne', sans-serif;
  outline: none;
  cursor: pointer;
}
input[type=text] { width: 220px; cursor: text; }
input[type=text]:focus, select:focus { border-color: var(--accent); }
.count-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  margin-left: auto;
}

/* ── MAIN LAYOUT ── */
.main { display:flex; flex:1; overflow:hidden; }

/* ── SIDEBAR ── */
.sidebar {
  width: 360px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  flex-shrink: 0;
}
.sidebar-inner {
  overflow-y: auto;
  flex: 1;
  padding-bottom: 20px;
}
.sidebar-inner::-webkit-scrollbar { width: 4px; }
.sidebar-inner::-webkit-scrollbar-track { background: transparent; }
.sidebar-inner::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ── ZONE HEADERS ── */
.zone-header {
  position: sticky;
  top: 0;
  z-index: 5;
  background: var(--text);
  color: var(--bg);
  padding: 8px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  user-select: none;
}
.zone-header:hover { background: #2a2a28; }
.zone-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 500;
  color: var(--accent);
  width: 22px;
  flex-shrink: 0;
}
.zone-name { font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; flex: 1; }
.zone-count {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: #888;
}
.zone-chevron { font-size: 10px; color: #666; transition: transform 0.2s; }
.zone-header.collapsed .zone-chevron { transform: rotate(-90deg); }

/* ── CUSTOMER ITEMS ── */
.customer-item {
  padding: 9px 16px 9px 44px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.12s;
  display: flex;
  gap: 10px;
  align-items: flex-start;
  position: relative;
}
.customer-item:hover { background: #f9f6f0; }
.customer-item.active { background: #fff5ee; }
.customer-item.active::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--accent);
}
.stop-num {
  position: absolute;
  left: 16px;
  top: 11px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  color: var(--muted);
  width: 18px;
  text-align: right;
}
.type-pip {
  width: 7px; height: 7px;
  border-radius: 50%;
  margin-top: 5px;
  flex-shrink: 0;
}
.c-name { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.3; }
.c-addr { font-size: 11px; color: var(--muted); margin-top: 1px; font-family: 'JetBrains Mono', monospace; }
.c-type {
  font-size: 10px;
  font-family: 'JetBrains Mono', monospace;
  margin-top: 2px;
  font-weight: 500;
}

/* ── MAP ── */
#map { flex:1; position:relative; }
#map iframe { width:100%; height:100%; border:none; }

.map-overlay {
  position: absolute;
  bottom: 20px;
  right: 20px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 16px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.12);
  font-size: 12px;
  max-width: 220px;
  z-index: 10;
}
.map-overlay-title { font-weight: 700; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.map-overlay-name { font-weight: 700; font-size: 14px; color: var(--text); margin-bottom: 3px; }
.map-overlay-addr { font-size: 11px; color: var(--muted); font-family: 'JetBrains Mono', monospace; margin-bottom: 5px; }
.map-overlay-type { font-size: 11px; font-weight: 600; }
.map-overlay-nav {
  margin-top: 8px;
  display: flex;
  gap: 6px;
}
.nav-btn {
  flex: 1;
  padding: 5px 0;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--bg);
  font-size: 10px;
  font-weight: 700;
  font-family: 'Syne', sans-serif;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.15s;
  color: var(--text);
}
.nav-btn:hover { background: var(--text); color: var(--bg); }
.nav-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.nav-btn.primary:hover { opacity: 0.85; }

.zone-hidden { display: none; }

/* ── LEAFLET CUSTOMISATION ── */
.leaflet-tooltip-custom {
  font-family: 'Syne', sans-serif;
  font-size: 12px;
  border-radius: 6px;
  border: 1px solid #e0dbd0;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  padding: 6px 10px;
  pointer-events: none;
}
.leaflet-container {
  font-family: 'Syne', sans-serif;
}
.leaflet-control-attribution {
  font-size: 9px !important;
}

/* ── VISITED STATE ── */
.customer-item.visited {
  background: #f0faf5 !important;
  opacity: 0.65;
}
.customer-item.visited .c-name {
  text-decoration: line-through;
  color: var(--muted);
}
.customer-item.visited .stop-num::before {
  content: '✓';
  color: #2a9e6e;
  font-weight: 700;
}
.customer-item.visited .stop-num {
  color: transparent;
  font-size: 0;
}
.customer-item.visited .type-pip {
  background: #2a9e6e !important;
}

/* ── TICK BUTTON ── */
.tick-btn {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 2px solid var(--border);
  background: var(--bg);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: transparent;
  transition: all 0.15s;
  flex-shrink: 0;
  z-index: 2;
}
.tick-btn:hover {
  border-color: #2a9e6e;
  background: #f0faf5;
  color: #2a9e6e;
}
.customer-item.visited .tick-btn {
  background: #2a9e6e;
  border-color: #2a9e6e;
  color: #fff;
}

/* ── ZONE PROGRESS BAR ── */
.zone-progress {
  height: 3px;
  background: rgba(255,255,255,0.15);
  position: relative;
  overflow: hidden;
}
.zone-progress-bar {
  height: 100%;
  background: #2a9e6e;
  transition: width 0.3s ease;
}
.zone-done-count {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  color: #2a9e6e;
  margin-right: 6px;
}

/* ── PROGRESS SUMMARY BAR ── */
.progress-bar-wrap {
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  padding: 6px 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.progress-track {
  flex: 1;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: #2a9e6e;
  border-radius: 3px;
  transition: width 0.3s ease;
}
.progress-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
}
.reset-btn {
  font-size: 10px;
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  background: none;
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 3px 8px;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.15s;
}
.reset-btn:hover { border-color: #c0392b; color: #c0392b; }

/* overlay check button */
.check-visit-btn {
  width: 100%;
  margin-top: 8px;
  padding: 7px 0;
  border-radius: 4px;
  border: 2px solid #2a9e6e;
  background: transparent;
  color: #2a9e6e;
  font-size: 11px;
  font-weight: 700;
  font-family: 'Syne', sans-serif;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.15s;
}
.check-visit-btn:hover, .check-visit-btn.done {
  background: #2a9e6e;
  color: #fff;
}

/* ── ZONE DROPDOWN ── */
.zone-dropdown-wrap {
  position: relative;
  display: inline-block;
}
.zone-dropdown-btn {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 28px 6px 12px;
  border-radius: 4px;
  font-size: 12px;
  font-family: 'Syne', sans-serif;
  font-weight: 600;
  cursor: pointer;
  outline: none;
  white-space: nowrap;
  min-width: 160px;
  text-align: left;
  position: relative;
  transition: border-color 0.15s;
}
.zone-dropdown-btn::after {
  content: '▼';
  font-size: 9px;
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
}
.zone-dropdown-btn:focus, .zone-dropdown-btn.open { border-color: var(--accent); }

.zone-dropdown-panel {
  display: none;
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  z-index: 999;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  box-shadow: 0 6px 24px rgba(0,0,0,0.12);
  min-width: 240px;
  max-height: 380px;
  overflow-y: auto;
  padding: 6px 0;
}
.zone-dropdown-panel.open { display: block; }
.zone-dropdown-panel::-webkit-scrollbar { width: 4px; }
.zone-dropdown-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.zdd-actions {
  display: flex;
  gap: 6px;
  padding: 6px 12px 8px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 4px;
}
.zdd-action-btn {
  font-size: 10px;
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  background: none;
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 3px 8px;
  border-radius: 3px;
  cursor: pointer;
  transition: all 0.15s;
}
.zdd-action-btn:hover { border-color: var(--accent); color: var(--accent); }

.zone-dd-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 14px;
  cursor: pointer;
  transition: background 0.1s;
  user-select: none;
}
.zone-dd-item:hover { background: #f5f2ec; }
.zone-dd-check {
  width: 16px; height: 16px;
  border: 2px solid var(--border);
  border-radius: 3px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  font-size: 10px;
  color: #fff;
  transition: all 0.12s;
}
.zone-dd-check.checked { border-color: var(--accent); background: var(--accent); }
.zone-dd-swatch {
  width: 10px; height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}
.zone-dd-label {
  font-size: 12px;
  font-weight: 600;
  flex: 1;
}
.zone-dd-count {
  font-size: 10px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--muted);
}
</style>
</head>
<body>

<header>
  <div class="logo">☀ Solar <span>Route</span></div>
  <div class="legend">
    <div class="leg"><div class="leg-dot" style="background:#e8940a"></div>Solar</div>
    <div class="leg"><div class="leg-dot" style="background:#2a9e6e"></div>Battery</div>
    <div class="leg"><div class="leg-dot" style="background:#1a6db5"></div>Solar+Battery</div>
    <div class="leg"><div class="leg-dot" style="background:#8b44b8"></div>HWHP/Other</div>
  </div>
  <div class="header-right">
    <span id="syncStatus" style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#2a9e6e;">⟳ Connecting…</span>
    <span class="total-badge" id="totalBadge">— stops</span>
    <button class="open-gmaps-btn" onclick="openFullRoute()">Open Route in Maps</button>
  </div>
</header>

<div class="controls">
  <input type="text" id="searchInput" placeholder="Search name or address…" oninput="filterAll()">
  <select id="typeFilter" onchange="filterAll()">
    <option value="">All types</option>
    <option value="solar">Solar</option>
    <option value="battery">Battery</option>
    <option value="hwhp">HWHP</option>
    <option value="top-up">Top-up</option>
  </select>

  <!-- Zone multi-select dropdown -->
  <div class="zone-dropdown-wrap" id="zoneDropdownWrap">
    <button class="zone-dropdown-btn" id="zoneDropdownBtn" onclick="toggleZoneDropdown()">All Zones</button>
    <div class="zone-dropdown-panel" id="zoneDropdownPanel">
      <div class="zdd-actions">
        <button class="zdd-action-btn" onclick="selectAllZones()">All</button>
        <button class="zdd-action-btn" onclick="selectNoZones()">None</button>
      </div>
      <div id="zoneCheckList"></div>
    </div>
  </div>

  <span class="count-badge" id="countBadge"></span>
</div>

<div class="progress-bar-wrap">
  <span class="progress-label" id="progressLabel">0 / 0 visited</span>
  <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <button class="reset-btn" onclick="resetAll()">Reset All</button>
</div>

<div class="main">
  <div class="sidebar">
    <div class="sidebar-inner" id="sidebarInner"></div>
  </div>
  <div id="map">
    <div id="leaflet-map" style="width:100%;height:100%;"></div>
    <div class="map-overlay" id="mapOverlay" style="display:none">
      <div class="map-overlay-title">Selected Stop</div>
      <div class="map-overlay-name" id="ovName"></div>
      <div class="map-overlay-addr" id="ovAddr"></div>
      <div class="map-overlay-type" id="ovType"></div>
      <div class="map-overlay-nav">
        <button class="nav-btn" onclick="navigateStop(-1)">◀ Prev</button>
        <button class="nav-btn primary" onclick="openInMaps()">Navigate</button>
        <button class="nav-btn" onclick="navigateStop(1)">Next ▶</button>
      </div>
      <button class="check-visit-btn" id="ovCheckBtn" onclick="toggleVisitedFromOverlay()">✓ Mark as Visited</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

// ─── HELPERS ──────────────────────────────────
function typeColor(t) {
  if (!t) return '#888';
  const s = t.toLowerCase();
  if (s.includes('solar') && s.includes('battery')) return '#1a6db5';
  if (s.includes('battery') || s.includes('top-up')) return '#2a9e6e';
  if (s.includes('solar')) return '#e8940a';
  if (s.includes('hwhp') || s.includes('hvac')) return '#8b44b8';
  return '#888';
}

// ─── JSONBIN CLOUD SYNC ────────────────────────
const JSONBIN_KEY = '$2a$10$KzsfKz96CWS5iZib4zFP5u8oLPOcW75ukh7oWU3E9JiNoaYByvry2';
const JSONBIN_BIN_KEY = 'solar_route_bin_id';
let BIN_ID = localStorage.getItem(JSONBIN_BIN_KEY) || null;
let visited = {};
let syncTimeout = null;
let lastSyncEtag = null;

function visitKey(c) { return c.name + '||' + c.address; }
function isVisited(c) { return !!visited[visitKey(c)]; }

function setSyncStatus(status, msg) {
  const el = document.getElementById('syncStatus');
  if (!el) return;
  const colors = { ok:'#2a9e6e', syncing:'#e8940a', error:'#e74c3c', offline:'#888' };
  el.style.color = colors[status] || '#888';
  el.textContent = msg;
}

async function ensureBin() {
  if (BIN_ID) return true;
  try {
    setSyncStatus('syncing', '⟳ Creating sync…');
    const res = await fetch('https://api.jsonbin.io/v3/b', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': JSONBIN_KEY,
        'X-Bin-Name': 'solar-route-visited',
        'X-Bin-Private': 'false'
      },
      body: JSON.stringify({ visited: {} })
    });
    const data = await res.json();
    BIN_ID = data.metadata.id;
    localStorage.setItem(JSONBIN_BIN_KEY, BIN_ID);
    setSyncStatus('ok', '✓ Synced');
    return true;
  } catch(e) {
    setSyncStatus('error', '✗ Sync failed');
    return false;
  }
}

async function loadFromCloud() {
  if (!BIN_ID) { await ensureBin(); return; }
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
      headers: { 'X-Master-Key': JSONBIN_KEY }
    });
    if (!res.ok) throw new Error('fetch failed');
    const etag = res.headers.get('X-Bin-Meta-Version') || res.headers.get('ETag');
    const data = await res.json();
    const newVisited = data.record?.visited || {};
    // Only re-render if data changed
    if (JSON.stringify(newVisited) !== JSON.stringify(visited)) {
      visited = newVisited;
      refreshAllUI();
    }
    lastSyncEtag = etag;
    setSyncStatus('ok', '✓ Synced');
  } catch(e) {
    setSyncStatus('offline', '⚠ Offline');
  }
}

async function saveToCloud() {
  if (!BIN_ID) { const ok = await ensureBin(); if (!ok) return; }
  try {
    setSyncStatus('syncing', '⟳ Saving…');
    await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': JSONBIN_KEY
      },
      body: JSON.stringify({ visited })
    });
    setSyncStatus('ok', '✓ Synced');
  } catch(e) {
    setSyncStatus('error', '✗ Save failed');
  }
}

function saveVisited() {
  // Debounce: wait 600ms after last change before saving
  clearTimeout(syncTimeout);
  syncTimeout = setTimeout(saveToCloud, 600);
}

function toggleVisited(c) {
  const k = visitKey(c);
  if (visited[k]) delete visited[k]; else visited[k] = Date.now();
  saveVisited();
}

function refreshAllUI() {
  // Refresh all markers
  zones.forEach(zone => zone.customers.forEach(c => refreshMarker(c)));
  // Refresh sidebar items
  zones.forEach(zone => {
    const visibleCustomers = zone.customers.filter(c => activeZones.has(zone.id));
    updateZoneProgress(zone, zone.customers);
  });
  // Refresh all customer-item visited states
  if (filteredData.length) {
    filteredData.forEach((c, idx) => {
      const item = document.getElementById(`stop-${idx}`);
      if (item) item.classList.toggle('visited', isVisited(c));
    });
  }
  updateProgress();
  // Refresh overlay button if open
  if (activeCustomer !== null && filteredData[activeCustomer]) {
    updateOverlayCheckBtn(filteredData[activeCustomer]);
  }
}

// ─── LEAFLET MAP SETUP ─────────────────────────
const leafletMap = L.map('leaflet-map', { zoomControl: true }).setView([-31.97, 152.47], 10);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  maxZoom: 19
}).addTo(leafletMap);

// Store markers keyed by visitKey
const markerMap = {};

function makeIcon(color, isVisited) {
  const bg = isVisited ? '#aaa' : color;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="32" viewBox="0 0 24 32">
    <path d="M12 0C5.37 0 0 5.37 0 12c0 9 12 20 12 20S24 21 24 12C24 5.37 18.63 0 12 0z" fill="${bg}" stroke="#fff" stroke-width="1.5"/>
    <circle cx="12" cy="12" r="5" fill="white" fill-opacity="0.85"/>
    ${isVisited ? '<text x="12" y="16" text-anchor="middle" font-size="9" font-weight="bold" fill="'+bg+'">✓</text>' : ''}
  </svg>`;
  return L.divIcon({
    html: svg,
    className: '',
    iconSize: [24, 32],
    iconAnchor: [12, 32],
    popupAnchor: [0, -32]
  });
}

function addAllMarkers() {
  zones.forEach(zone => {
    zone.customers.forEach(c => {
      if (!c.lat || !c.lng) return;
      const key = visitKey(c);
      const marker = L.marker([c.lat, c.lng], { icon: makeIcon(typeColor(c.type), isVisited(c)) })
        .addTo(leafletMap);
      marker.bindTooltip(`<b>${c.name}</b><br><small>${c.address}</small><br><small style="color:${typeColor(c.type)}">${c.type}</small>`, {
        direction: 'top', offset: [0, -28], className: 'leaflet-tooltip-custom'
      });
      marker.on('click', () => {
        // Find this customer in filteredData
        const idx = filteredData.findIndex(fc => visitKey(fc) === key);
        if (idx !== -1) selectCustomer(idx);
      });
      markerMap[key] = marker;
    });
  });
}

function refreshMarker(c) {
  const key = visitKey(c);
  const marker = markerMap[key];
  if (marker) marker.setIcon(makeIcon(typeColor(c.type), isVisited(c)));
}

function flyToCustomer(c) {
  leafletMap.flyTo([c.lat, c.lng], 16, { duration: 0.8 });
}

let activeCustomer = null;
let stopCounter = 0;
let filteredData = [];

// ─── PROGRESS BAR ──────────────────────────────
function updateProgress() {
  const total = filteredData.length;
  const done = filteredData.filter(c => isVisited(c)).length;
  const pct = total > 0 ? Math.round(done / total * 100) : 0;
  document.getElementById('progressLabel').textContent = `${done} / ${total} visited`;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('totalBadge').textContent = `${total - done} remaining`;
}

// ─── BUILD SIDEBAR ─────────────────────────────
function buildSidebar(search='', typeF='') {
  const container = document.getElementById('sidebarInner');
  container.innerHTML = '';
  stopCounter = 0;
  filteredData = [];
  let totalShown = 0;

  zones.forEach(zone => {
    // Skip zones not in the active set
    if (activeZones.size > 0 && !activeZones.has(zone.id)) return;

    const customers = zone.customers.filter(c => {
      const ms = !search || c.name.toLowerCase().includes(search) || c.address.toLowerCase().includes(search);
      const mt = !typeF || c.type.toLowerCase().includes(typeF);
      return ms && mt;
    });
    if (customers.length === 0) return;

    totalShown += customers.length;
    const zoneDone = customers.filter(c => isVisited(c)).length;
    const zonePct = Math.round(zoneDone / customers.length * 100);

    const zh = document.createElement('div');
    zh.className = 'zone-header';
    zh.id = `zone-hdr-${zone.id}`;
    zh.innerHTML = `
      <span class="zone-num">${String(zone.id).padStart(2,'0')}</span>
      <span class="zone-name" style="border-left:3px solid ${zone.color};padding-left:8px">${zone.name}</span>
      <span class="zone-done-count" id="zdone-${zone.id}">${zoneDone > 0 ? zoneDone+'/'+customers.length : ''}</span>
      <span class="zone-count">${customers.length}</span>
      <span class="zone-chevron">▼</span>
    `;

    const zoneProgress = document.createElement('div');
    zoneProgress.className = 'zone-progress';
    zoneProgress.innerHTML = `<div class="zone-progress-bar" id="zpbar-${zone.id}" style="width:${zonePct}%"></div>`;

    const zoneBody = document.createElement('div');
    zoneBody.className = 'zone-body';

    zh.onclick = (e) => {
      if (e.target.closest('.tick-btn')) return;
      // Fly map to zone centre
      const lats = customers.map(c=>c.lat), lngs = customers.map(c=>c.lng);
      const bounds = L.latLngBounds(customers.map(c=>[c.lat,c.lng]));
      leafletMap.flyToBounds(bounds, { padding: [40,40], maxZoom: 14, duration: 0.7 });
      const collapsed = zh.classList.toggle('collapsed');
      zoneBody.style.display = collapsed ? 'none' : '';
    };

    container.appendChild(zh);
    container.appendChild(zoneProgress);

    customers.forEach(c => {
      stopCounter++;
      const globalIdx = filteredData.length;
      filteredData.push(c);
      const done = isVisited(c);

      const item = document.createElement('div');
      item.className = 'customer-item' + (done ? ' visited' : '');
      item.id = `stop-${globalIdx}`;
      item.innerHTML = `
        <span class="stop-num">${stopCounter}</span>
        <div class="type-pip" style="background:${typeColor(c.type)}"></div>
        <div style="flex:1;min-width:0">
          <div class="c-name">${c.name}</div>
          <div class="c-addr">${c.address}</div>
          <div class="c-type" style="color:${typeColor(c.type)}">${c.type}</div>
        </div>
        <button class="tick-btn" title="${done ? 'Mark as unvisited' : 'Mark as visited'}">✓</button>
      `;

      item.addEventListener('click', (e) => {
        if (e.target.closest('.tick-btn')) return;
        selectCustomer(globalIdx);
      });

      item.querySelector('.tick-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        toggleVisited(c);
        item.classList.toggle('visited', isVisited(c));
        refreshMarker(c);
        updateZoneProgress(zone, customers);
        updateProgress();
        if (activeCustomer === globalIdx) updateOverlayCheckBtn(c);
      });

      zoneBody.appendChild(item);
    });

    container.appendChild(zoneBody);
  });

  document.getElementById('countBadge').textContent = totalShown + ' customers shown';
  updateProgress();
}

function updateZoneProgress(zone, customers) {
  const done = customers.filter(c => isVisited(c)).length;
  const pct = Math.round(done / customers.length * 100);
  const bar = document.getElementById(`zpbar-${zone.id}`);
  const lbl = document.getElementById(`zdone-${zone.id}`);
  if (bar) bar.style.width = pct + '%';
  if (lbl) lbl.textContent = done > 0 ? done+'/'+customers.length : '';
}

function updateOverlayCheckBtn(c) {
  const btn = document.getElementById('ovCheckBtn');
  if (!btn) return;
  const done = isVisited(c);
  btn.textContent = done ? '✓ Visited — Click to Undo' : '✓ Mark as Visited';
  btn.classList.toggle('done', done);
}

function selectCustomer(idx) {
  document.querySelectorAll('.customer-item.active').forEach(el => el.classList.remove('active'));
  const item = document.getElementById(`stop-${idx}`);
  if (item) {
    item.classList.add('active');
    item.scrollIntoView({ behavior:'smooth', block:'nearest' });
  }

  activeCustomer = idx;
  const c = filteredData[idx];

  // Fly map to this pin
  flyToCustomer(c);

  // Open marker tooltip briefly
  const key = visitKey(c);
  const marker = markerMap[key];
  if (marker) {
    marker.openTooltip();
    setTimeout(() => marker.closeTooltip(), 3000);
  }

  // Update overlay panel
  const ov = document.getElementById('mapOverlay');
  ov.style.display = 'block';
  document.getElementById('ovName').textContent = c.name;
  document.getElementById('ovAddr').textContent = c.address;
  document.getElementById('ovType').textContent = c.type;
  document.getElementById('ovType').style.color = typeColor(c.type);
  updateOverlayCheckBtn(c);
}

function toggleVisitedFromOverlay() {
  if (activeCustomer === null) return;
  const c = filteredData[activeCustomer];
  toggleVisited(c);
  const item = document.getElementById(`stop-${activeCustomer}`);
  if (item) item.classList.toggle('visited', isVisited(c));
  refreshMarker(c);
  updateOverlayCheckBtn(c);
  updateProgress();
  zones.forEach(zone => {
    if (zone.customers.some(zc => visitKey(zc) === visitKey(c))) {
      updateZoneProgress(zone, zone.customers);
    }
  });
}

function navigateStop(dir) {
  if (activeCustomer === null) return;
  const next = activeCustomer + dir;
  if (next >= 0 && next < filteredData.length) selectCustomer(next);
}

function openInMaps() {
  if (activeCustomer === null) return;
  const c = filteredData[activeCustomer];
  // Detects iOS/Android for Apple/Google Maps
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const url = isIOS
    ? `maps://maps.apple.com/?q=${encodeURIComponent(c.address)}`
    : `https://maps.google.com/?q=${encodeURIComponent(c.address)}`;
  window.open(url, '_blank');
}

function openFullRoute() {
  const allStops = filteredData.filter(c => !isVisited(c)).slice(0, 10);
  if (allStops.length < 2) { alert('Need at least 2 unvisited stops'); return; }
  const origin = encodeURIComponent(allStops[0].address);
  const dest = encodeURIComponent(allStops[allStops.length-1].address);
  const waypoints = allStops.slice(1,-1).map(c => encodeURIComponent(c.address)).join('|');
  const url = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${dest}&waypoints=${waypoints}&travelmode=driving`;
  window.open(url, '_blank');
}

function resetAll() {
  if (!confirm('Reset ALL visited checkmarks for everyone?')) return;
  visited = {};
  saveToCloud();
  zones.forEach(zone => zone.customers.forEach(c => refreshMarker(c)));
  buildSidebar(
    document.getElementById('searchInput').value.toLowerCase(),
    document.getElementById('typeFilter').value.toLowerCase()
  );
  document.getElementById('mapOverlay').style.display = 'none';
  activeCustomer = null;
}

function filterAll() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const typeF = document.getElementById('typeFilter').value.toLowerCase();
  buildSidebar(search, typeF);
}

// ─── ZONE DROPDOWN ─────────────────────────────
let activeZones = new Set(); // empty = all shown

function buildZoneDropdown() {
  const list = document.getElementById('zoneCheckList');
  list.innerHTML = '';
  zones.forEach(zone => {
    activeZones.add(zone.id); // start with all on
    const item = document.createElement('div');
    item.className = 'zone-dd-item';
    item.id = `zdd-${zone.id}`;
    item.innerHTML = `
      <div class="zone-dd-check checked" id="zdd-chk-${zone.id}">✓</div>
      <div class="zone-dd-swatch" style="background:${zone.color}"></div>
      <span class="zone-dd-label">${zone.name}</span>
      <span class="zone-dd-count">${zone.customers.length}</span>
    `;
    item.addEventListener('click', () => toggleZone(zone.id));
    list.appendChild(item);
  });
}

function toggleZone(zoneId) {
  if (activeZones.has(zoneId)) {
    activeZones.delete(zoneId);
  } else {
    activeZones.add(zoneId);
  }
  const chk = document.getElementById(`zdd-chk-${zoneId}`);
  if (chk) {
    chk.classList.toggle('checked', activeZones.has(zoneId));
    chk.textContent = activeZones.has(zoneId) ? '✓' : '';
  }
  updateDropdownLabel();
  applyZoneVisibility();
  filterAll();
}

function selectAllZones() {
  zones.forEach(z => {
    activeZones.add(z.id);
    const chk = document.getElementById(`zdd-chk-${z.id}`);
    if (chk) { chk.classList.add('checked'); chk.textContent = '✓'; }
  });
  updateDropdownLabel();
  applyZoneVisibility();
  filterAll();
}

function selectNoZones() {
  zones.forEach(z => {
    activeZones.delete(z.id);
    const chk = document.getElementById(`zdd-chk-${z.id}`);
    if (chk) { chk.classList.remove('checked'); chk.textContent = ''; }
  });
  updateDropdownLabel();
  applyZoneVisibility();
  filterAll();
}

function updateDropdownLabel() {
  const btn = document.getElementById('zoneDropdownBtn');
  if (activeZones.size === zones.length) {
    btn.textContent = 'All Zones';
  } else if (activeZones.size === 0) {
    btn.textContent = 'No Zones';
  } else if (activeZones.size === 1) {
    const z = zones.find(z => activeZones.has(z.id));
    btn.textContent = z ? z.name : '1 Zone';
  } else {
    btn.textContent = `${activeZones.size} Zones`;
  }
  // Re-add the arrow (btn.textContent wipes ::after pseudo so we use a span trick)
  btn.setAttribute('data-label', btn.textContent);
}

function applyZoneVisibility() {
  // Show/hide markers for each zone
  zones.forEach(zone => {
    const visible = activeZones.has(zone.id);
    zone.customers.forEach(c => {
      const key = visitKey(c);
      const marker = markerMap[key];
      if (!marker) return;
      if (visible) {
        if (!leafletMap.hasLayer(marker)) marker.addTo(leafletMap);
      } else {
        if (leafletMap.hasLayer(marker)) leafletMap.removeLayer(marker);
      }
    });
  });
}

function toggleZoneDropdown() {
  const panel = document.getElementById('zoneDropdownPanel');
  const btn = document.getElementById('zoneDropdownBtn');
  const open = panel.classList.toggle('open');
  btn.classList.toggle('open', open);
}

// Close dropdown when clicking outside
document.addEventListener('click', (e) => {
  const wrap = document.getElementById('zoneDropdownWrap');
  if (wrap && !wrap.contains(e.target)) {
    document.getElementById('zoneDropdownPanel').classList.remove('open');
    document.getElementById('zoneDropdownBtn').classList.remove('open');
  }
});

// ─── INIT ──────────────────────────────────────
addAllMarkers();
buildZoneDropdown();
buildSidebar();
// Load cloud state on startup
loadFromCloud();
</script>
