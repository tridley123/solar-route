<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Mid North Coast Route</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#0f172a;--panel:#ffffff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--accent:#f59e0b;--ok:#16a34a;--chip:#f1f5f9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
#map{position:fixed;inset:0;z-index:1}
/* top bar */
#top{position:fixed;top:0;left:0;right:0;z-index:500;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;background:linear-gradient(#0f172aee,#0f172acc);color:#fff}
#top .row{display:flex;align-items:center;gap:8px}
#top h1{font-size:15px;margin:0;flex:1;font-weight:700;letter-spacing:.2px}
#top h1 small{display:block;font-weight:500;font-size:11px;color:#cbd5e1}
.ibtn{border:0;background:#1e293b;color:#fff;border-radius:10px;height:36px;min-width:36px;padding:0 10px;font-size:14px;font-weight:600;cursor:pointer}
.ibtn.on{background:var(--accent);color:#111}
#prog{height:6px;background:#334155;border-radius:3px;margin-top:8px;overflow:hidden}
#progbar{height:100%;width:0;background:var(--ok);transition:width .3s}
#sync{font-size:11px;color:#cbd5e1;margin-top:4px;display:flex;justify-content:space-between}
#sync .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#64748b;margin-right:4px;vertical-align:middle}
#sync .dot.live{background:#22c55e}#sync .dot.err{background:#ef4444}
/* chips */
#chips{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid transparent;background:#1e293b;color:#e2e8f0;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
.chip .sw{width:10px;height:10px;border-radius:50%}
.chip.on{background:#fff;color:#0f172a}
.chip.off{opacity:.45}
/* drawer */
#drawer{position:fixed;z-index:600;left:0;right:0;bottom:0;background:var(--panel);border-radius:18px 18px 0 0;box-shadow:0 -6px 30px #0006;height:42vh;display:flex;flex-direction:column;transition:height .25s ease;padding-bottom:env(safe-area-inset-bottom)}
#drawer.min{height:58px}#drawer.max{height:86vh}
#handle{padding:8px 14px 6px;cursor:pointer;user-select:none}
#handle .grip{width:40px;height:5px;background:#cbd5e1;border-radius:3px;margin:0 auto 8px}
#handle .hrow{display:flex;align-items:center;gap:8px}
#handle b{font-size:14px;flex:1}
#q{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:15px;margin:0 14px;width:calc(100% - 28px)}
#types{display:flex;gap:6px;overflow-x:auto;padding:8px 14px;scrollbar-width:none}
#types .chip{background:var(--chip);color:#334155}
#types .chip.on{background:#0f172a;color:#fff}
#list{overflow-y:auto;flex:1;padding:0 0 20px;-webkit-overflow-scrolling:touch}
.zh{position:sticky;top:0;background:#f8fafc;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px 14px;font-size:12px;font-weight:700;color:#334155;display:flex;align-items:center;gap:8px;z-index:2;cursor:pointer}
.zh .sw{width:12px;height:12px;border-radius:50%}
.zh span.c{margin-left:auto;font-weight:600;color:var(--muted)}
.it{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #f1f5f9}
.it.done{opacity:.45}.it.done .nm{text-decoration:line-through}
.ck{flex:0 0 28px;height:28px;border-radius:8px;border:2px solid #cbd5e1;background:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;cursor:pointer}
.it.done .ck{background:var(--ok);border-color:var(--ok)}
.tx{flex:1;min-width:0;cursor:pointer}
.nm{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ad{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg{display:inline-block;font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;background:#fef3c7;color:#92400e;margin-top:3px}
.tg.Battery{background:#dbeafe;color:#1e40af}.tg.SB{background:#dcfce7;color:#166534}.tg.HW{background:#fce7f3;color:#9d174d}
.go{flex:0 0 auto;text-decoration:none;background:#0f172a;color:#fff;border-radius:9px;padding:7px 10px;font-size:12px;font-weight:700}
/* markers */
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 5px #0007;display:flex;align-items:center;justify-content:center}
.pin i{transform:rotate(45deg);font-style:normal;color:#fff;font-size:10px;font-weight:800}
.pin.done{background:#94a3b8 !important;opacity:.7}
.leaflet-popup-content{margin:12px 14px;min-width:220px}
.pp h3{margin:0 0 2px;font-size:15px}.pp .a{font-size:12px;color:#475569;margin-bottom:6px}
.pp .p{border-top:1px solid #f1f5f9;padding:7px 0}
.pp .btns{display:flex;gap:6px;margin-top:6px}
.pp button,.pp a.b{flex:1;border:0;border-radius:9px;padding:9px;font-size:13px;font-weight:700;text-align:center;text-decoration:none;cursor:pointer}
.pp .mk{background:var(--ok);color:#fff}.pp .mk.un{background:#e2e8f0;color:#334155}
.pp a.b{background:#0f172a;color:#fff}
.me{width:16px;height:16px;background:#3b82f6;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 6px #3b82f640}
/* modal */
#modal{position:fixed;inset:0;z-index:900;background:#0008;display:none;align-items:center;justify-content:center;padding:16px}
#modal.show{display:flex}
#modal .box{background:#fff;border-radius:16px;padding:18px;max-width:420px;width:100%}
#modal h2{margin:0 0 6px;font-size:17px}
#modal p{font-size:13px;color:#475569;margin:0 0 12px;line-height:1.45}
#modal label{font-size:12px;font-weight:700;display:block;margin:10px 0 4px}
#modal input{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;font-size:14px}
#modal .acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
#modal .acts button{flex:1;border:0;border-radius:10px;padding:11px;font-weight:700;font-size:14px;cursor:pointer}
.pri{background:#0f172a;color:#fff}.sec{background:#e2e8f0;color:#0f172a}.dan{background:#fee2e2;color:#991b1b}
.leaflet-top{top:calc(env(safe-area-inset-top) + 128px)}
@media(min-width:900px){
 #drawer{left:auto;right:12px;top:140px;bottom:12px;width:380px;height:auto !important;border-radius:16px}
 #drawer.min{height:58px !important;bottom:auto}
}
</style>
</head>

<div id="top">
 <div class="row">

</div>

<div id="drawer">

</div>

<div id="modal"><div class="box">
 <h2>Team sync (JSONBin)</h2>
 <p>Enter the same Bin ID and key on both phones so check-offs show up for everyone. These stay on this device only. Leave blank to work offline.</p>

  <button class="pri" id="saveSet">Save & sync</button>
  <button class="sec" id="closeSet">Close</button>
 </div>
 <div class="acts"><button class="dan" id="resetAll">Reset all check-offs</button></div>
</div></div>

orster","type":"Top-up & Battery","zone":13},{"id":285,"name":"Christopher Blomgren","address":"3 Minnibah Circuit, Forster NSW 2428","lat":-32.1962001,"lng":152.5331493,"suburb":"Forster","type":"Solar","zone":13},{"id":286,"name":"Kate Mutch","address":"24 Fairway Crescent, Forster NSW 2428","lat":-32.1860357,"lng":152.5267386,"suburb":"Forster","type":"Solar","zone":13},{"id":287,"name":"Jenyce Fernando","address":"93 Glider Ave, Darawank NSW 2428","lat":-32.09257,"lng":152.4742814,"suburb":"Darawank","type":"Solar & Battery","zone":13},{"id":288,"name":"Belinda Clancy","address":"9 Lucas Ave, Green Point NSW 2428","lat":-32.2487975,"lng":152.5153452,"suburb":"Green Point","type":"Solar","zone":13},{"id":289,"name":"Cheryl Brophy","address":"157 Green Point Drive, Green Point NSW 2428","lat":-32.2516546,"lng":152.5235209,"suburb":"Green Point","type":"Solar","zone":13},{"id":290,"name":"Jane Adams","address":"86 Green Point Drive, Green Point NSW 2428","lat":-32.2510377,"lng":152.5165319,"suburb":"Green Point","type":"Solar","zone":13},{"id":291,"name":"Paul Teys","address":"9 Coast Ave, Boomerang Beach NSW 2428","lat":-32.3370212,"lng":152.5433938,"suburb":"Boomerang Beach","type":"Battery","zone":14},{"id":292,"name":"Chris Humphries","address":"44 Red Gum Rd, Boomerang Beach NSW 2428","lat":-32.3442844,"lng":152.5369252,"suburb":"Boomerang Beach","type":"Solar","zone":14},{"id":293,"name":"Mark O'Neill","address":"32 Belbourie Crescent, Boomerang Beach NSW 2428","lat":-32.3437608,"lng":152.5377183,"suburb":"Boomerang Beach","type":"Solar","zone":14},{"id":294,"name":"Kirk Owers","address":"1/10 Harrow Drive, Boomerang Beach NSW 2428","lat":-32.3370334,"lng":152.542902,"suburb":"Boomerang Beach","type":"Solar","zone":14},{"id":295,"name":"Katrina Read","address":"183 Boomerang Drive, Blueys Beach NSW 2428","lat":-32.3479129,"lng":152.5373283,"suburb":"Blueys Beach","type":"Battery","zone":14}];
const ZONES = [{"zone": 1, "label": "Wingham"}, {"zone": 2, "label": "Nabiac / Krambach +"}, {"zone": 3, "label": "Wherrol Flat / Burrell Creek +"}, {"zone": 4, "label": "Upper Lansdowne / Lansdowne +"}, {"zone": 5, "label": "Tinonee"}, {"zone": 6, "label": "Cundletown / Kundle Kundle"}, {"zone": 7, "label": "Taree / Red Head"}, {"zone": 8, "label": "Pampoolah / Mitchells Island +"}, {"zone": 9, "label": "Wallabi Point / Ghinni Ghinni"}, {"zone": 10, "label": "Old Bar / Tallwoods Village +"}, {"zone": 11, "label": "Hallidays Point / Koorainghat"}, {"zone": 12, "label": "Smiths Lake / Failford +"}, {"zone": 13, "label": "Forster / Tuncurry +"}, {"zone": 14, "label": "Boomerang Beach / Blueys Beach"}];
const COLORS = ["#e11d48","#ea580c","#d97706","#65a30d","#059669","#0891b2","#2563eb","#7c3aed","#c026d3","#db2777","#0d9488","#4f46e5","#b45309","#475569"];
const zc = z => COLORS[(z-1)%COLORS.length];
const LS = k => 'mnc_route_'+k;
const ls = {get(k,d){try{const v=localStorage.getItem(LS(k));return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(LS(k),JSON.stringify(v))}catch(e){}}};

// state: checks = {id:{d:bool,t:ms,by:str}}
let checks = ls.get('checks',{});
let cfg = ls.get('cfg',{binId:'',binKey:'',who:''});
let zoneOn = new Set(ZONES.map(z=>z.zone));
let typeSel = 'All';
let hideDone = ls.get('hideDone',false);
const isDone = id => !!(checks[id] && checks[id].d);

// map
const map = L.map('map',{zoomControl:false}).setView([-31.98,152.47],10);
L.control.zoom({position:'topleft'}).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);

// group customers sharing the same coords into one pin
const groups = {};
DATA.forEach(c=>{const k=c.lat.toFixed(6)+','+c.lng.toFixed(6);(groups[k]=groups[k]||[]).push(c)});
const markers = {};
Object.entries(groups).forEach(([k,arr])=>{
  const m = L.marker([arr[0].lat,arr[0].lng]);
  m._cust = arr; arr.forEach(c=>c._key=k);
  m.bindPopup(()=>popupHtml(arr),{maxWidth:280});
  markers[k]=m;
});
function pinIcon(arr){
  const done = arr.every(c=>isDone(c.id));
  const n = arr.length>1?arr.length:'';
  return L.divIcon({className:'',iconSize:[26,26],iconAnchor:[13,26],popupAnchor:[0,-24],
    html:`<div class="pin ${done?'done':''}" style="background:${zc(arr[0].zone)}"><i>${n}</i></div>`});
}
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dirUrl = c => 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(c.address);
function popupHtml(arr){
  const c0=arr[0];
  return `<div class="pp"><div class="a">${esc(c0.address)}${c0.approx?' <b style="color:#b45309">(approx. pin)</b>':''}</div>`+
   arr.map(c=>{const d=isDone(c.id);const by=d&&checks[c.id].by?` · ${esc(checks[c.id].by)}`:'';
    return `<div class="p"><h3>${esc(c.name)}</h3><span class="tg ${tcls(c.type)}">${esc(c.type)}</span> <span style="font-size:11px;color:#64748b">Zone ${c.zone} · #${c.id}${by}</span>
    <div class="btns"><button class="mk ${d?'un':''}" onclick="toggle(${c.id})">${d?'Undo':'✓ Done'}</button></div></div>`}).join('')+
   `<div class="btns"><a class="b" target="_blank" rel="noopener" href="${dirUrl(c0)}">Directions ↗</a></div></div>`;
}
const tcls = t => t==='Battery'?'Battery':t.includes('HWHP')?'HW':(t.includes('&')?'SB':'');

// chips
const chipsEl=document.getElementById('chips');
function renderChips(){
  const all = zoneOn.size===ZONES.length;
  chipsEl.innerHTML = `<div class="chip ${all?'on':''}" data-z="all">All zones</div>`+
   ZONES.map(z=>{const left=DATA.filter(c=>c.zone===z.zone&&!isDone(c.id)).length;
     return `<div class="chip ${zoneOn.has(z.zone)?'':'off'}" data-z="${z.zone}"><span class="sw" style="background:${zc(z.zone)}"></span>Z${z.zone} ${esc(z.label)} · ${left}</div>`}).join('');
}
chipsEl.onclick=e=>{const ch=e.target.closest('.chip');if(!ch)return;const z=ch.dataset.z;
  if(z==='all'){zoneOn = zoneOn.size===ZONES.length? new Set(): new Set(ZONES.map(z=>z.zone));}
  else{const n=+z; if(zoneOn.size===ZONES.length){zoneOn=new Set([n]);} else if(zoneOn.has(n)){zoneOn.delete(n);} else zoneOn.add(n);
    if(zoneOn.size===0) zoneOn=new Set(ZONES.map(z=>z.zone));
    fitTo([...zoneOn]);}
  refresh();};
function fitTo(zs){const pts=DATA.filter(c=>zs.includes(c.zone)).map(c=>[c.lat,c.lng]);if(pts.length)map.fitBounds(pts,{padding:[40,40],maxZoom:15});}

const TYPES=['All','Solar','Battery','Solar & Battery','Top-up','HWHP'];
const typesEl=document.getElementById('types');
function renderTypes(){typesEl.innerHTML=TYPES.map(t=>`<div class="chip ${t===typeSel?'on':''}" data-t="${esc(t)}">${esc(t)}</div>`).join('')}
typesEl.onclick=e=>{const ch=e.target.closest('.chip');if(!ch)return;typeSel=ch.dataset.t;refresh();};
function typeMatch(c){if(typeSel==='All')return true;if(typeSel==='Solar')return c.type==='Solar';if(typeSel==='Battery')return c.type==='Battery';
  if(typeSel==='Solar & Battery')return c.type==='Solar & Battery';return c.type.includes(typeSel);}

const qEl=document.getElementById('q');qEl.oninput=()=>refresh();
function visible(c){
  if(!zoneOn.has(c.zone))return false; if(!typeMatch(c))return false;
  if(hideDone&&isDone(c.id))return false;
  const q=qEl.value.trim().toLowerCase(); if(q&&!(c.name+' '+c.address+' '+c.suburb).toLowerCase().includes(q))return false;
  return true;
}

function refresh(){
  // markers
  Object.values(markers).forEach(m=>{
    const show=m._cust.some(visible);
    if(show){m.setIcon(pinIcon(m._cust)); if(!map.hasLayer(m))m.addTo(map);} else if(map.hasLayer(m)) map.removeLayer(m);
    if(m.isPopupOpen()) m.setPopupContent(popupHtml(m._cust));
  });
  // list
  const vis=DATA.filter(visible);
  let html='';
  ZONES.forEach(z=>{const items=vis.filter(c=>c.zone===z.zone);if(!items.length)return;
    const done=DATA.filter(c=>c.zone===z.zone&&isDone(c.id)).length,tot=DATA.filter(c=>c.zone===z.zone).length;
    html+=`<div class="zh" data-z="${z.zone}"><span class="sw" style="background:${zc(z.zone)}"></span>Zone ${z.zone} · ${esc(z.label)}<span class="c">${done}/${tot}</span></div>`;
    items.forEach(c=>{const d=isDone(c.id);
      html+=`<div class="it ${d?'done':''}"><div class="ck" onclick="toggle(${c.id})">${d?'✓':''}</div>
       <div class="tx" onclick="focusC(${c.id})"><div class="nm">${esc(c.name)}</div><div class="ad">${esc(c.address)}</div><span class="tg ${tcls(c.type)}">${esc(c.type)}</span></div>
       <a class="go" target="_blank" rel="noopener" href="${dirUrl(c)}">Go ↗</a></div>`;});
  });
  document.getElementById('list').innerHTML = html || '<p style="padding:20px;color:#64748b;text-align:center">Nothing matches.</p>';
  const doneN=DATA.filter(c=>isDone(c.id)).length;
  document.getElementById('count').textContent=`${vis.length} showing`;
  document.getElementById('progtxt').textContent=`${doneN} / ${DATA.length} done (${Math.round(doneN/DATA.length*100)}%)`;
  document.getElementById('progbar').style.width=(doneN/DATA.length*100)+'%';
  document.getElementById('btnDone').classList.toggle('on',hideDone);
  renderChips();renderTypes();
}
document.getElementById('list').addEventListener('click',e=>{const zh=e.target.closest('.zh');if(zh)fitTo([+zh.dataset.z]);});

window.toggle=function(id){
  const d=!isDone(id); checks[id]={d,t:Date.now(),by:cfg.who||''};
  ls.set('checks',checks); refresh(); pushSync();
};
window.focusC=function(id){const c=DATA.find(x=>x.id===id);const m=markers[c._key];
  if(!map.hasLayer(m))m.addTo(map); map.setView([c.lat,c.lng],17); m.openPopup();
  if(window.innerWidth<900) drawer.className='min';};

// drawer
const drawer=document.getElementById('drawer');
document.getElementById('handle').onclick=()=>{drawer.className = drawer.className==='min'?'':drawer.className===''?'max':'min';};

document.getElementById('btnDone').onclick=()=>{hideDone=!hideDone;ls.set('hideDone',hideDone);refresh();};

// location
let meM=null,watching=false;
document.getElementById('btnLoc').onclick=()=>{
  if(!navigator.geolocation)return alert('Location not available');
  if(watching&&meM){map.setView(meM.getLatLng(),15);return;}
  watching=true;document.getElementById('btnLoc').classList.add('on');
  navigator.geolocation.watchPosition(p=>{const ll=[p.coords.latitude,p.coords.longitude];
    if(!meM){meM=L.marker(ll,{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[16,16],iconAnchor:[8,8]})}).addTo(map);map.setView(ll,15);} else meM.setLatLng(ll);},
   e=>{alert('Could not get location: '+e.message);watching=false;document.getElementById('btnLoc').classList.remove('on');},{enableHighAccuracy:true});
};

// ---------- JSONBin sync ----------
const modal=document.getElementById('modal');
const $=id=>document.getElementById(id);
$('btnSet').onclick=()=>{$('binId').value=cfg.binId;$('binKey').value=cfg.binKey;$('who').value=cfg.who;modal.classList.add('show');};
$('closeSet').onclick=()=>modal.classList.remove('show');
$('saveSet').onclick=()=>{cfg={binId:$('binId').value.trim(),binKey:$('binKey').value.trim(),who:$('who').value.trim()};ls.set('cfg',cfg);modal.classList.remove('show');pullSync(true).then(()=>pushSync());};
$('resetAll').onclick=()=>{if(!confirm('Clear every check-off? If sync is on, this clears it for the whole team.'))return;
  const t=Date.now();DATA.forEach(c=>{if(checks[c.id])checks[c.id]={d:false,t,by:cfg.who||''}});ls.set('checks',checks);refresh();pushSync();modal.classList.remove('show');};

function setStatus(cls,txt){$('dot').className='dot '+cls;$('synctxt').textContent=txt;}
const syncOn=()=>cfg.binId&&cfg.binKey;
const hdr=()=>{const h={'Content-Type':'application/json'};h[cfg.binKey.startsWith('$2')&&cfg.binKey.length>50?'X-Master-Key':'X-Access-Key']=cfg.binKey;return h;};
function merge(remote){let changed=false;
  Object.entries(remote||{}).forEach(([id,v])=>{if(!v||typeof v!=='object')return;const l=checks[id];if(!l||(v.t||0)>(l.t||0)){checks[id]=v;changed=true;}});
  return changed;}
async function fetchRemote(){
  const r=await fetch(`https://api.jsonbin.io/v3/b/${cfg.binId}/latest`,{headers:Object.assign(hdr(),{'X-Bin-Meta':'false'})});
  if(!r.ok)throw new Error(r.status);const j=await r.json();return (j&&j.checks)||{};}
async function pullSync(force){
  if(!syncOn()){setStatus('','Local only');return;}
  try{const rem=await fetchRemote();if(merge(rem)){ls.set('checks',checks);refresh();}
    setStatus('live','Synced '+new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}));}
  catch(e){setStatus('err','Sync error ('+e.message+')');}
}
let pushT=null;
function pushSync(){ if(!syncOn())return; clearTimeout(pushT); pushT=setTimeout(async()=>{
  try{ try{merge(await fetchRemote());}catch(e){}
    const r=await fetch(`https://api.jsonbin.io/v3/b/${cfg.binId}`,{method:'PUT',headers:hdr(),body:JSON.stringify({checks,updated:Date.now()})});
    if(!r.ok)throw new Error(r.status); ls.set('checks',checks); refresh();
    setStatus('live','Synced '+new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}));
  }catch(e){setStatus('err','Not saved to cloud ('+e.message+') – kept on phone');}
 },600);}
setInterval(()=>{if(!document.hidden)pullSync()},15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pullSync()});

refresh();
map.fitBounds(DATA.map(c=>[c.lat,c.lng]),{padding:[30,30]});
pullSync();
</script>
